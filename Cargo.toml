# The desktop app is the root package; spread-core holds feeds and the engine
# with no UI dependency, so it can be tested and run headless on its own.
[workspace]
members = ["crates/spread-core"]
resolver = "2"

[package]
name = "spreadradar"
version = "0.1.35"
edition = "2021"
default-run = "spreadradar"
description = "Cross-venue crypto spreads, lead/lag and new listings, with Jupiter swaps"
license-file = "LICENSE"

[dependencies]
# Decodes the embedded logo for the window icon (see window_icon in main.rs).
image = { version = "0.25", default-features = false, features = ["png"] }
dioxus = { version = "=0.7.10", features = ["desktop"] }
# What every mayorana desktop app shares: statistics, update check, notice and
# licence. Beside this repository; CI checks it out there at a pinned tag.
desktop-kit = { path = "../desktop-kit", features = ["ui"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
spread-core = { path = "crates/spread-core" }
# Opens Solscan links in the system browser instead of inside the webview.
open = "5"
# Copy buttons write to the system clipboard directly; the webview's
# clipboard API is not reliably available in a desktop app.
arboard = { version = "3", default-features = false }
# Update check and notice banner, fetched from mayorana.ch. Same TLS choice
# as spread-core, so no second TLS stack gets compiled.
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"

# Embeds assets/icon.ico and the product name into the .exe (see build.rs).
base64 = "0.22"
# The anonymous install id for usage statistics: 128 random bits. Already
# in the tree via other crates, so this names a dependency rather than adding one.
getrandom = "0.3"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[workspace.lints.clippy]
# The same lints in every desktop app. A panic is a crash the user sees, so unwrap and expect
# are refused outside tests, as is unsafe code without a SAFETY comment. Where one is right
# (a constant that cannot fail), allow it on that item and say why.
unwrap_used = "deny"
expect_used = "deny"
undocumented_unsafe_blocks = "deny"

[lints]
workspace = true
